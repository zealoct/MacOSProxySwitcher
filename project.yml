name: MPS
options:
  bundleIdPrefix: com.macproxyswitcher
  deploymentTarget:
    macOS: "13.0"
  minimumXcodeGenVersion: "2.45"
  generateEmptyDirectories: true

targets:
  MPS:
    type: application
    platform: macOS
    sources:
      - path: MPS
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: MPS
        PRODUCT_BUNDLE_IDENTIFIER: com.macproxyswitcher.app
        INFOPLIST_KEY_CFBundleDisplayName: MacProxySwitcher
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_ENTITLEMENTS: MPS/MPS/MPS.entitlements
        INFOPLIST_FILE: MPS/MPS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LSUIElement: true
      configs:
        debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Automatic
        release:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Automatic
    entitlements:
      path: MPS/MPS/MPS.entitlements
      properties:
        com.apple.security.app-sandbox: false
