<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>MacProxySwitcher app icon</title>
  <desc>A luminous globe with an enabled switch on a rounded blue tile.</desc>
  <defs>
    <linearGradient id="tile" x1="160" y1="100" x2="830" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#247BFA"/>
      <stop offset=".52" stop-color="#1353CD"/>
      <stop offset="1" stop-color="#102D7F"/>
    </linearGradient>
    <radialGradient id="light" cx=".22" cy=".06" r=".95">
      <stop stop-color="#72E2FF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#72E2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="globe" x1="310" y1="220" x2="700" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5DDFF"/>
    </linearGradient>
    <linearGradient id="switch" x1="433" y1="632" x2="742" y2="799" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63F4D0"/>
      <stop offset="1" stop-color="#16CBA6"/>
    </linearGradient>
    <linearGradient id="knob" x1="698" y1="655" x2="698" y2="783" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F8FF"/>
    </linearGradient>
    <filter id="tileShadow" x="-.15" y="-.15" width="1.3" height="1.4">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#061D50" flood-opacity=".24"/>
    </filter>
    <filter id="switchShadow" x="-.3" y="-.5" width="1.6" height="2">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001C61" flood-opacity=".38"/>
    </filter>
    <filter id="knobShadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#006756" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="202" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="64" y="64" width="896" height="896" rx="202" fill="url(#light)"/>
  <rect x="66" y="66" width="892" height="892" rx="200" fill="none" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="4"/>
  <g fill="none" stroke="url(#globe)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="490" cy="470" r="252" stroke-width="30"/>
    <ellipse cx="490" cy="470" rx="112" ry="252" stroke-width="24"/>
    <path d="M250 470H730 M282 330Q490 411 698 330 M282 610Q490 529 698 610" stroke-width="24"/>
  </g>
  <g filter="url(#switchShadow)">
    <rect x="403" y="619" width="397" height="194" rx="97" fill="#124BA9"/>
    <rect x="415" y="631" width="373" height="170" rx="85" fill="url(#switch)"/>
    <rect x="417" y="633" width="369" height="166" rx="83" fill="none" stroke="#B8FFEA" stroke-opacity=".4" stroke-width="3"/>
    <path d="M479 716H525 M508 699L525 716L508 733" fill="none" stroke="#087B70" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="699" cy="716" r="65" fill="url(#knob)" filter="url(#knobShadow)"/>
  </g>
</svg>
